[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mem0-mcp-selfhosted"
version = "0.4.0"
description = "Self-hosted mem0 MCP server for Claude Code"
license = "MIT"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "elvismdev" },
]
dependencies = [
    "mcp[cli]>=1.23.0",
    "mem0ai[llms,nlp]>=2.0.1",
    "anthropic>=0.77.0",
    "fastembed>=0.3.1",
    "python-dotenv>=1.2.1",
    # spaCy English model required for mem0 v3 entity linking. Pinned as a
    # wheel URL so `uv sync` installs it deterministically — otherwise
    # `python -m spacy download` is needed as a separate post-install step.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
mem0-mcp-selfhosted = "mem0_mcp_selfhosted:main"
mem0-hook-context = "mem0_mcp_selfhosted.hooks:context_main"
mem0-hook-session-end = "mem0_mcp_selfhosted.hooks:session_end_main"
mem0-install-hooks = "mem0_mcp_selfhosted.hooks:install_main"

[tool.hatch.build.targets.wheel]
packages = ["src/mem0_mcp_selfhosted"]

[tool.hatch.metadata]
# Required so the en_core_web_sm wheel URL in [project.dependencies] is accepted.
allow-direct-references = true

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require live infrastructure (Qdrant, Ollama, Anthropic)",
    "contract: tests that validate mem0ai internal API stability",
]

[tool.ruff]
# Existing code intentionally keeps each FastMCP `Annotated[type, Field(...)]`
# parameter on a single line for readability; ruff's default 88 would explode
# every tool signature. 200 matches the natural width of those declarations
# without enabling truly unreadable lines elsewhere.
line-length = 200

[tool.ruff.lint.per-file-ignores]
# `add_memory`, `search_memories`, etc. are @mcp.tool()-decorated closures
# inside `_register_tools`; they look unused to ruff/pyright but are
# registered as side effects. Same for the `memory_assistant` MCP prompt.
"src/mem0_mcp_selfhosted/server.py" = ["F811"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/mem0_mcp_selfhosted/__init__.py:__version__"]
branches.main = { match = "main", prerelease = false }
tag_format = "v{version}"
commit_parser = "angular"
commit_message = "chore(release): v{version} [skip ci]"
upload_to_pypi = false
upload_to_repository = false

[tool.semantic_release.commit_parser_options]
patch_tags = ["fix", "perf"]
minor_tags = ["feat"]
allowed_tags = [
    "build", "chore", "ci", "docs", "feat", "fix",
    "perf", "refactor", "style", "test",
]

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "^chore\\(release\\):",
    "^Merge ",
]

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.semantic_release.remote]
type = "github"
token = { env = "GH_TOKEN" }
